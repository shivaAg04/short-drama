# Very Good Analysis: the strict lint set used across many production Flutter
# codebases. Two rules are off, each for a stated reason.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # This is an app, not a published package: comments go where the code
    # needs explaining, not on every public member.
    public_member_api_docs: false
    # Asks for Dart 3.13's constructor shorthand. Kept classic so the code
    # reads (and builds) on the Flutter versions reviewers are likely to have.
    unnecessary_type_name_in_constructor: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, trace specs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze (very_good_analysis)
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Every automated criterion has a test
        run: |
          dart run tool/spec_coverage.dart --strict | tee spec_coverage.txt
          {
            echo '### Spec coverage'
            echo '```'
            tail -n 1 spec_coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
